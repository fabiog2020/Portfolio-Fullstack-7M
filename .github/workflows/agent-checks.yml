name: Agent checks

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'templates/**'

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install --upgrade pip
      - name: Run backend checks
        run: python tools/agent_backend_check.py
      - name: Run frontend checks
        run: python tools/agent_frontend_check.py
