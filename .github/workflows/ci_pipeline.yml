name: Integração Contínua (CI) FinanceApp

# Quando esse workflow deve rodar?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório
    - name: Checkout do código
      uses: actions/checkout@v3

    # 2. Configura o Python
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 3. Instala dependências
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt  # Precisamos do pytest que está aqui

    # 4. Verifica estilo de código (Linting) - Opcional, mas recomendado
    # Vamos usar o ruff ou flake8 se estiverem instalados, senão pula
    - name: Lint com Ruff
      run: |
        pip install ruff
        # Roda o linter mas não quebra o build por enquanto (--exit-zero)
        ruff check . --exit-zero

    # 5. Roda os Testes Automatizados
    - name: Executar Testes com Pytest
      run: |
        # Configura variáveis de ambiente necessárias para o teste não falhar por falta de config
        export FLASK_APP=app.py
        export FLASK_ENV=testing
        pytest -v