{% extends "base.html" %}

{% block title %}Meu Perfil{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 p-6 bg-white dark:bg-dark-card rounded-lg shadow-md">

    <div class="flex items-center space-x-4 mb-6">
        <div
            class="w-16 h-16 bg-brand-blue rounded-full flex items-center justify-center text-white text-2xl font-bold">
            {{ user.nome[0] | upper }}
        </div>
        <div>
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">{{ user.nome }}</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400">{{ user.email }}</p>
            <span class="inline-block mt-1 px-2 py-1 text-xs font-semibold rounded bg-green-100 text-green-800">
                Plano: {{ user.plano | upper }}
            </span>
        </div>
    </div>

    <!-- Abas de Navegação Interna -->
    <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
        <a href="#" class="px-4 py-2 border-b-2 border-brand-blue text-brand-blue font-medium">Dados</a>
        <a href="{{ url_for('profile.planos') }}"
            class="px-4 py-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Planos</a>
        <a href="{{ url_for('profile.suporte') }}"
            class="px-4 py-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">Suporte</a>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nome Completo</label>
            <input type="text" name="nome" value="{{ user.nome }}" required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring focus:ring-brand-blue focus:ring-opacity-50 dark:bg-dark-input dark:border-gray-600 dark:text-white p-2 border">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nova Senha (deixe em branco para
                manter)</label>
            <input type="password" name="senha" placeholder="********"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-brand-blue focus:ring focus:ring-brand-blue focus:ring-opacity-50 dark:bg-dark-input dark:border-gray-600 dark:text-white p-2 border">
        </div>

        <div class="pt-4">
            <button type="submit"
                class="w-full bg-brand-blue hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-200">
                Salvar Alterações
            </button>
        </div>
    </form>
</div>
{% endblock %}
